name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]


jobs:
  # ─────────────────────────────────────────────
  # Backend: pytest
  # ─────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]" || \
          .venv/bin/pip install \
            "fastapi>=0.111" \
            "uvicorn[standard]>=0.29" \
            "aiosqlite>=0.20" \
            "python-jose[cryptography]>=3.3" \
            "python-multipart>=0.0.9" \
            "httpx>=0.27" \
            "pydantic>=2.7" \
            "pydantic-settings>=2.3" \
            "openai>=1.30" \
            "mcp>=1.0" \
            "python-dateutil>=2.9" \
            "pytest>=8.2" \
            "pytest-asyncio>=0.23" \
            "respx>=0.21" \
            "httpx[asyncio]"

      - name: Run pytest
        run: |
          backend/.venv/bin/pytest backend/tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # Frontend: Vitest unit tests + TypeScript build
  # ─────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (Vitest + tsc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type check + build
        run: |
          cd frontend
          npm run build

      - name: Run Vitest
        run: |
          cd frontend
          npm test

  # ─────────────────────────────────────────────
  # Playwright E2E tests
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Install frontend dependencies and Playwright browsers
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: |
          cd frontend
          npm run test:e2e
        env:
          DEV_MODE: "true"
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Docker build smoke test
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t subcontrol:ci .

      - name: Start container and health check
        run: |
          docker run -d \
            --name subcontrol-ci \
            -p 8000:8000 \
            -e DEV_MODE=true \
            -e DATABASE_URL="sqlite+aiosqlite:////tmp/ci.db" \
            subcontrol:ci
          # Wait for startup
          sleep 5
          curl -f http://localhost:8000/api/health

      - name: Stop container
        if: always()
        run: docker stop subcontrol-ci && docker rm subcontrol-ci

  # ─────────────────────────────────────────────
  # Publish to GitHub Container Registry
  # ─────────────────────────────────────────────
  docker-publish:
    name: Publish Docker image (ghcr.io)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build]
    if: github.event_name == 'release'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alexlambertz/subcontrol
          tags: |
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
