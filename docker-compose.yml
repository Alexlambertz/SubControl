services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database outside the container
      - ./data:/app/data
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////app/data/subcontrol.db"
      DEV_MODE: "${DEV_MODE:-false}"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-subcontrol}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional Keycloak for production OIDC (activate with --profile oidc)
  keycloak:
    profiles: [oidc]
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data:
