services:
  app:
    image: ghcr.io/alexlambertz/subcontrol:2.0.0
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database outside the container
      - ./data:/app/data
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////app/data/subcontrol.db"
      DEV_MODE: "${DEV_MODE:-false}"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_PUBLIC_ISSUER_URL: "${OIDC_PUBLIC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-subcontrol}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      AI_API_URL: "${AI_API_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

